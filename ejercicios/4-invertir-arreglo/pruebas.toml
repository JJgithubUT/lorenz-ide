# Pruebas del ejercicio. Cada una parte de un estado distinto y comprueba el resultado.
formato = "lorenz-pruebas-0.1"
maquina = "../maquina.toml"

[[prueba]]
nombre = "1 palabras"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R6 = 16384, R1 = 1 }
memoria = [ { direccion = 16384, palabras = [5] } ]
[prueba.espera]
memoria = [ { direccion = 16384, palabras = [5] } ]

