# Pruebas del ejercicio. Cada una parte de un estado distinto y comprueba el resultado.
formato = "lorenz-pruebas-0.1"
maquina = "../maquina.toml"

[[prueba]]
nombre = "R1 = 7"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 7 }
[prueba.espera]
