# Pruebas del ejercicio. Cada una parte de un estado distinto y comprueba el resultado.
formato = "lorenz-pruebas-0.1"
maquina = "../maquina.toml"

[[prueba]]
nombre = "|9 - 4|"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 9, R2 = 4 }
[prueba.espera]
registros = { R3 = 5 }

[[prueba]]
nombre = "|4 - 9|"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 4, R2 = 9 }
[prueba.espera]
registros = { R3 = 5 }

[[prueba]]
nombre = "|5 - 5|"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 5, R2 = 5 }
[prueba.espera]
registros = { R3 = 0 }

[[prueba]]
nombre = "|0 - 32767|"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 0, R2 = 32767 }
[prueba.espera]
registros = { R3 = 32767 }

[[prueba]]
nombre = "|32767 - 0|"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 32767, R2 = 0 }
[prueba.espera]
registros = { R3 = 32767 }
