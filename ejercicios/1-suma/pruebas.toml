# Pruebas del ejercicio. Cada una parte de un estado distinto y comprueba el resultado.
formato = "lorenz-pruebas-0.1"
maquina = "../maquina.toml"

[[prueba]]
nombre = "3 + 4"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 3, R2 = 4 }
[prueba.espera]
registros = { R3 = 7 }

[[prueba]]
nombre = "200 + 300"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 200, R2 = 300 }
[prueba.espera]
registros = { R3 = 500 }

[[prueba]]
nombre = "65535 + 2"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 65535, R2 = 2 }
[prueba.espera]
registros = { R3 = 1 }

[[prueba]]
nombre = "0 + 0"
programa = "solucion.s"
limite = 1000
[prueba.inicial]
registros = { R1 = 0, R2 = 0 }
[prueba.espera]
registros = { R3 = 0 }
