<!doctype html>
<meta charset="utf-8">
<title>Lorenz en el navegador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 16px system-ui, sans-serif; margin: 0 auto; max-width: 52rem; padding: 1rem; }
  textarea { width: 100%; box-sizing: border-box; font: 14px ui-monospace, monospace; }
  pre { background: #f2f2f2; padding: .75rem; overflow: auto; }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e6e6e6; } pre { background: #23262c; } textarea { background: #1d2025; color: inherit; } }
</style>
<h1>Lorenz en el navegador</h1>
<p>El nucleo (arquitectura, ensamblador y emulador) corre aqui como WebAssembly, sin servidor.</p>
<label>Maquina (TOML)<br><textarea id="maquina" rows="10"></textarea></label>
<label>Programa<br><textarea id="programa" rows="8">        HLT
</textarea></label>
<p><button id="ejecutar">Ejecutar</button></p>
<pre id="salida" aria-live="polite">Cargando...</pre>
<script type="module">
  import { cargarLorenz } from './lorenz.js';
  const salida = document.getElementById('salida');
  try {
    const lorenz = await cargarLorenz('./lorenz_wasm.wasm');
    salida.textContent = 'Listo. Pega una maquina y un programa.';
    document.getElementById('ejecutar').onclick = () => {
      const r = lorenz.ejecutar(maquina.value, programa.value);
      salida.textContent = (r.ok ? '' : 'Error:\n') + r.texto;
    };
  } catch (e) { salida.textContent = 'No se pudo cargar el modulo: ' + e.message; }
</script>
