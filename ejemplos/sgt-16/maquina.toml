# Maquina RISC de 16 bits pensada para compilar SGT: ocho registros generales, multiplicacion,
# instrucciones de dos palabras con constantes de 16 bits, entrada y salida por puerto e
# interrupciones con la direccion de retorno en la pila. Palabras y direcciones de 16 bits.

[maquina]
nombre         = "sgt-16"
formato        = "0.1"
bits_palabra   = 16
bits_direccion = 16
endianness     = "little"
arranque       = 0x0000
pila           = "descendente"

[maquina.interrupciones]
vectores = { 0 = 0x0010, 1 = 0x0020 }
habilitadas_al_arrancar = false

[[registro]]
nombre = "R0"
bits = 16
rol = "general"
inicial = 0

[[registro]]
nombre = "R1"
bits = 16
rol = "general"
inicial = 0

[[registro]]
nombre = "R2"
bits = 16
rol = "general"
inicial = 0

[[registro]]
nombre = "R3"
bits = 16
rol = "general"
inicial = 0

[[registro]]
nombre = "R4"
bits = 16
rol = "general"
inicial = 0

[[registro]]
nombre = "R5"
bits = 16
rol = "general"
inicial = 0

[[registro]]
nombre = "R6"
bits = 16
rol = "general"
inicial = 0

[[registro]]
nombre = "R7"
bits = 16
rol = "general"
inicial = 0

[[registro]]
nombre = "SP"
bits = 16
rol = "sp"
inicial = 0xDFFF

[[registro]]
nombre = "PC"
bits = 16
rol = "pc"

[[region]]
nombre = "rom"
desde  = 0x0000
hasta  = 0x3FFF
acceso = "r"

[[region]]
nombre = "ram"
desde  = 0x4000
hasta  = 0xDFFF
acceso = "rw"

[[dispositivo]]
nombre  = "serie"
tipo    = "uart"
puertos = { datos = 0x10, estado = 0x11 }

[[dispositivo]]
nombre       = "reloj"
tipo         = "temporizador"
periodo      = 1000
interrupcion = 0

[[instruccion]]
mnemonico = "NOP"
sintaxis  = "NOP"
codigo    = "00000 ..........."
semantica = ""
ciclos    = 1
descripcion = "No hace nada."


[[instruccion]]
mnemonico = "HLT"
sintaxis  = "HLT"
codigo    = "00001 ..........."
semantica = "detener"
ciclos    = 1
descripcion = "Detiene la maquina."


[[instruccion]]
mnemonico = "MOV"
sintaxis  = "MOV {rd}, {rs}"
codigo    = "00010 rd:3 rs:3 ....."
semantica = "rd = rs"
ciclos    = 1
descripcion = "Copia un registro."
  [[instruccion.operando]]
  nombre = "rd"
  tipo = "registro"
  de = ["R0", "R1", "R2", "R3", "R4", "R5", "R6", "R7"]
  [[instruccion.operando]]
  nombre = "rs"
  tipo = "registro"
  de = ["R0", "R1", "R2", "R3", "R4", "R5", "R6", "R7"]


[[instruccion]]
mnemonico = "LDI"
sintaxis  = "LDI {rd}, {imm}"
codigo    = "00011 rd:3 ........ | imm:16"
semantica = "rd = imm"
ciclos    = 2
descripcion = "Carga una constante de 16 bits."
  [[instruccion.operando]]
  nombre = "rd"
  tipo = "registro"
  de = ["R0", "R1", "R2", "R3", "R4", "R5", "R6", "R7"]
  [[instruccion.operando]]
  nombre = "imm"
  tipo = "inmediato"
  signo = false
  rango = [0, 65535]


