sintaxis  = "BEQ {rs}, {rt}, {off}"
codigo    = "01110 rs:3 rt:3 ..... | off:12 ...."
semantica = "si rs == rt: pc = pc + off"
ciclos    = 2
descripcion = "Salta si rs == rt (sin signo)."
  [[instruccion.operando]]
  nombre = "rs"
  tipo = "registro"
  de = ["R0", "R1", "R2", "R3", "R4", "R5", "R6", "R7"]
