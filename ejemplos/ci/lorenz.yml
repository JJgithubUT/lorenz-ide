# Ejemplo de flujo de integracion continua para un proyecto de usuario de Lorenz.
# Adaptalo a tu proveedor: solo usa la linea de comandos, sin entorno grafico.
name: lorenz
on: [push, pull_request]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar lorenz
        run: cargo install --locked --path lorenz/crates/lorenz-cli
      - name: Pruebas del proyecto (falla con 1, 5 o 6)
        run: lorenz probar pruebas.toml --historial --cobertura --json --salida resultados.json
      - name: Conformidad de la arquitectura
        run: lorenz conformidad maquina.toml --json --salida conformidad.json
      - name: Programas aleatorios reproducibles
        run: lorenz aleatorio maquina.toml --semilla 42 --programas 200 --json --salida aleatorio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes
          path: "*.json"
